<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>会员注册</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
    main { max-width: 420px; margin: 40px auto; background: #fff; padding: 26px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    h2 { margin-top: 0; }
    label { display: block; font-size: 13px; color: #475569; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { margin-top: 18px; width: 100%; padding: 11px; border: none; border-radius: 8px; background: #0ea5e9; color: #fff; cursor: pointer; font-size: 15px; }
    #msg { margin-top: 12px; min-height: 18px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h2>会员注册</h2>
    <form id="regForm" onsubmit="return doReg(event)">
      <label for="name">姓名</label>
      <input id="name" name="name" type="text" aria-label="姓名" />
      <label for="email">邮箱</label>
      <input id="email" name="email" type="text" aria-label="邮箱" />
      <label for="phone">手机号</label>
      <input id="phone" name="phone" type="text" aria-label="手机号" />
      <button id="submitBtn" type="submit" aria-label="提交注册按钮">提交注册</button>
    </form>
    <p id="msg" aria-live="polite"></p>
  </main>
  <script>
    function doReg(e) {
      e.preventDefault();
      var n = document.getElementById('name').value.trim();
      var em = document.getElementById('email').value.trim();
      if (!n || !em) { document.getElementById('msg').textContent = '请填写必填项'; document.getElementById('msg').style.color = '#dc2626'; return false; }
      document.getElementById('msg').style.color = '#16a34a';
      document.getElementById('msg').textContent = '注册成功，欢迎 ' + n;
      return false;
    }
  </script>
</body>
</html>
