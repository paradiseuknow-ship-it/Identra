<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>优选商城 - 商品搜索</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #222; }
    header { background: #1f2937; color: #fff; padding: 16px 32px; font-size: 18px; }
    main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
    .searchbar { display: flex; gap: 8px; }
    input#q { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
    button#searchBtn { padding: 10px 20px; font-size: 15px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    #results { margin-top: 20px; }
    .product { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .product .meta .name { font-weight: 600; }
    .product .meta .price { color: #b45309; margin-top: 4px; }
    .product button { padding: 8px 14px; border: none; border-radius: 8px; background: #16a34a; color: #fff; cursor: pointer; }
    #cartbar { margin-top: 16px; font-size: 14px; color: #555; }
    #cartbar b { color: #16a34a; }
  </style>
</head>
<body>
  <header>优选商城 · 商品搜索</header>
  <main>
    <div class="searchbar">
      <input id="q" name="q" type="text" placeholder="搜索商品，如 机械键盘" aria-label="搜索框" />
      <button id="searchBtn" type="button" aria-label="搜索按钮">搜索</button>
    </div>
    <div id="results" aria-live="polite"></div>
    <div id="cartbar">购物车：<b id="cart">0</b> 件</div>
  </main>

  <script>
    var CATALOG = {
      '机械键盘': { price: '¥399', desc: 'RGB 热插拔机械键盘' },
      '无线鼠标': { price: '¥129', desc: '静音无线鼠标' },
      '4K显示器': { price: '¥1599', desc: '27寸 4K IPS' }
    };
    var cart = 0;
    function render(q) {
      var box = document.getElementById('results');
      box.innerHTML = '';
      var hits = Object.keys(CATALOG).filter(function (k) { return k.indexOf(q) >= 0; });
      if (!hits.length) { box.textContent = '未找到相关商品'; return; }
      hits.forEach(function (k) {
        var p = CATALOG[k];
        var row = document.createElement('div');
        row.className = 'product';
        row.innerHTML = '<div class="meta"><span class="name">' + k + '</span><div class="price">' + p.price + ' · ' + p.desc + '</div></div>';
        var btn = document.createElement('button');
        btn.id = 'addBtn';
        btn.setAttribute('aria-label', '加入购物车');
        btn.textContent = '加入购物车';
        btn.onclick = function () { cart++; document.getElementById('cart').textContent = cart; btn.textContent = '已加入购物车'; };
        row.appendChild(btn);
        box.appendChild(row);
      });
    }
    document.getElementById('searchBtn').addEventListener('click', function () {
      var q = document.getElementById('q').value.trim();
      if (q) render(q);
    });
  </script>
</body>
</html>
