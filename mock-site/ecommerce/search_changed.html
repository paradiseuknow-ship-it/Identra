<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>优选商城 - 改版搜索（元素变更）</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #222; }
    header { background: #1f2937; color: #fff; padding: 16px 32px; font-size: 18px; }
    main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
    /* 改版：搜索框 id 由 #q 改为 #query，但 aria-label 保持“搜索框”，用于验证元素变更恢复 */
    input#query { padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; width: 320px; }
    button#doSearch { padding: 10px 20px; font-size: 15px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    #results { margin-top: 20px; min-height: 30px; }
  </style>
</head>
<body>
  <header>优选商城 · 改版搜索</header>
  <main>
    <input id="query" name="query" type="text" placeholder="搜索商品" aria-label="搜索框" />
    <button id="doSearch" type="button" aria-label="搜索按钮">搜索</button>
    <p id="results" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('doSearch').addEventListener('click', function () {
      var q = document.getElementById('query').value.trim();
      document.getElementById('results').textContent = '搜索结果：' + (q || '(空)');
    });
  </script>
</body>
</html>
